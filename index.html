<script>
/* ══════════════════════════════════════════════════════════════════════
   WantNot Instant Audit (browser-only)

   Runs entirely in the visitor's browser. Signs the customer's admin in
   with OIDC / auth-code + PKCE, calls Microsoft Graph directly with
   DELEGATED permissions, and analyses the result client-side.

   No backend. No client secret (PKCE means a public client needs none).
   No database. Nothing is transmitted anywhere except between the
   visitor's browser and Microsoft.

   That last property is the entire point: it removes the biggest
   objection in this product ("you want read access to our directory?")
   because there is no server on our side that could retain anything.

   What it CANNOT do, by construction: a delegated token only exists
   while someone is signed in. So no scheduled scans, no history, no
   scan-over-scan deltas, no multi-tenant portfolio. Those need the
   app-only backend.
   ══════════════════════════════════════════════════════════════════════ */

const MSAL_CDNS = [
  'https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js',
  'https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js'
];
const GRAPH = 'https://graph.microsoft.com/v1.0';
const SCOPES = [
  'https://graph.microsoft.com/Organization.Read.All',
  'https://graph.microsoft.com/User.Read.All',
  'https://graph.microsoft.com/AuditLog.Read.All'
];

/* ═════════════════════ ANALYZER START ═════════════════════
   Imported via audit_logic.js (loaded above) — the single source shared with
   the private backend's shared/analyzer.py, verified against
   fixtures/parity_expected.json by tools/parity_check.py.
   ═══════════════════════ ANALYZER END ═════════════════════ */

/* KINDS now in kinds.js (single source); inline is fallback for file:// */
var KINDS = (typeof KINDS !== 'undefined' && KINDS) ? KINDS : (typeof KINDS_SHARED !== 'undefined' ? KINDS_SHARED : {
  unassigned_seats:['Unassigned seats','--k1'], disabled_user:['Disabled accounts','--k2'],
  dormant_user:['Dormant users','--k3'], never_signed_in:['Never signed in','--k4'],
  redundant_sku:['Redundant licenses','--k5'],
  deleted_user:['Deleted accounts','--k6']
});
if (typeof KINDS_SHARED !== 'undefined') KINDS = KINDS_SHARED;
var ORDER = (typeof ORDER_SHARED !== 'undefined') ? ORDER_SHARED : Object.keys(KINDS);
const CONF = {certain:'Certain', high:'Likely', review:'Review'};
const kLabel = k => (KINDS[k]||[k])[0];
const kVar = k => `var(${(KINDS[k]||[null,'--ink-3'])[1]})`;
const usd0 = n => '$'+Math.round(n||0).toLocaleString('en-US');
const usd2 = n => '$'+(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const int = n => Number(n||0).toLocaleString('en-US');
const compact = n => n>=1e6 ? '$'+(n/1e6).toFixed(2)+'M' : n>=1e4 ? '$'+Math.round(n/1e3)+'K' : usd0(n);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = () => document.getElementById('view');



/* ── MSAL ─────────────────────────────────────────────────────────── */
let msalApp = null, account = null, lastResult = null, tenantName = '';

function loadScript(srcs, timeoutMs = 12000){
  return new Promise((resolve,reject)=>{
    let i = 0;
    const tryNext = () => {
      if(i >= srcs.length){
        return reject(new Error(
          'Could not load the Microsoft sign-in library. A network policy or content '+
          'blocker may be blocking alcdn.msauth.net.'));
      }
      const s = document.createElement('script');
      let settled = false;
      // A blocked CDN can hang without ever firing onerror, which would leave
      // the page blank forever. Time out and fall through instead.
      const timer = setTimeout(()=>{ if(!settled){ settled = true; s.remove(); tryNext(); } }, timeoutMs);
      const done = fn => () => { if(settled) return; settled = true; clearTimeout(timer); fn(); };
      s.src = srcs[i++];
      s.onload = done(resolve);
      s.onerror = done(tryNext);
      document.head.appendChild(s);
    };
    tryNext();
  });
}

/* Authority resolution.

   Default is /organizations: any work or school tenant, personal Microsoft
   accounts refused. That is correct for real customers. A personal account
   has no directory, no licenses and nothing to audit.

   An override exists for one case: a personal Microsoft account that is the
   administrator of an Entra tenant (e.g. the "Default Directory" created when
   you sign up for Azure with an MSA). /organizations rejects that identity by
   home realm, but the tenant-specific endpoint accepts it. Useful for testing
   your own directory; not something to hand a prospect.

   Precedence: ?tenant=<guid> on the URL, then config.js, then /organizations. */
function resolveAuthority(){
  const q = new URLSearchParams(location.search).get('tenant');
  const t = (q || window.WANTNOT_AUDIT_TENANT || '').trim();
  if(!t) return { url:'https://login.microsoftonline.com/organizations', pinned:null };
  if(!/^[0-9a-f-]{36}$|^[\w.-]+\.[\w.-]+$/i.test(t)){
    throw new Error('That tenant value is not a valid tenant ID or domain name.');
  }
  return { url:'https://login.microsoftonline.com/'+encodeURIComponent(t), pinned:t };
}

let AUTHORITY = { url:'https://login.microsoftonline.com/organizations', pinned:null };

async function initMsal(){
  const clientId = (window.WANTNOT_AUDIT_CLIENT_ID||'').trim();
  if(!clientId) throw new Error('NO_CONFIG');
  AUTHORITY = resolveAuthority();
  await loadScript(MSAL_CDNS);
  msalApp = new msal.PublicClientApplication({
    auth:{
      clientId,
      authority: AUTHORITY.url,
      // A pinned tenant is not in MSAL's default trusted list, so it has to be
      // declared explicitly or MSAL refuses the authority outright.
      knownAuthorities: AUTHORITY.pinned ? ['login.microsoftonline.com'] : [],
      redirectUri: location.origin + location.pathname
    },
    cache:{ cacheLocation:'sessionStorage', storeAuthStateInCookie:false }
  });
  // MSAL v3 requires an explicit initialize(); v2 does not have it.
  if(typeof msalApp.initialize === 'function') await msalApp.initialize();
  const resp = await msalApp.handleRedirectPromise().catch(()=>null);
  if(resp && resp.account) account = resp.account;
  else account = msalApp.getAllAccounts()[0] || null;
}

async function getToken(){
  const req = { scopes: SCOPES, account };
  try { return (await msalApp.acquireTokenSilent(req)).accessToken; }
  catch { return (await msalApp.acquireTokenPopup(req)).accessToken; }
}

async function signIn(){
  const req = { scopes: SCOPES, prompt:'select_account' };
  try{
    const r = await msalApp.loginPopup(req);
    account = r.account;
  }catch(e){
    // Popup blocked or third-party cookies disabled, fall back to redirect.
    if(/popup_window_error|user_cancelled|BrowserAuthError/i.test(e.errorCode||e.message||'')){
      if(/user_cancelled/i.test(e.errorCode||'')) throw e;
      return msalApp.loginRedirect(req);
    }
    throw e;
  }
}

/* ── Graph ────────────────────────────────────────────────────────── */
async function gfetch(url, token, headers){
  for(let attempt=0; attempt<5; attempt++){
    const r = await fetch(url, {headers:{Authorization:'Bearer '+token, Accept:'application/json', ...(headers||{})}});
    if(r.status === 429 || r.status >= 500){
      const wait = parseInt(r.headers.get('Retry-After')||'',10) || Math.min(2**attempt,30);
      await new Promise(res=>setTimeout(res, wait*1000));
      continue;
    }
    if(!r.ok){
      let code='unknown', message=r.statusText;
      try{ const j = await r.json(); code=(j.error||{}).code||code; message=(j.error||{}).message||message; }catch{}
      const err = new Error(message); err.status=r.status; err.code=code; throw err;
    }
    return r.json();
  }
  throw new Error('Microsoft Graph kept throttling the request. Try again shortly.');
}

async function gpage(path, token, headers, onProgress){
  let url = path.startsWith('http') ? path : GRAPH+path;
  const out = [];
  while(url){
    const page = await gfetch(url, token, headers);
    out.push(...(page.value||[]));
    if(onProgress) onProgress(out.length);
    url = page['@odata.nextLink'];
  }
  return out;
}

/* Only what a finding needs. `id` and `userType` were requested and read by
   nothing. An object id is a durable directory identifier, so fetching one for
   no purpose is the same mistake the CSV importer avoids. `department` is here
   because findings now carry it, so the live path attributes the same way an
   imported one does. Narrow the $select and Graph returns less. */
const USER_SELECT = 'displayName,userPrincipalName,accountEnabled,createdDateTime,assignedLicenses,department';

async function runAudit(setStep){
  const token = await getToken();

  setStep('Reading organisation details…', 5);
  const orgs = await gpage('/organization?$select=id,displayName,verifiedDomains', token);
  tenantName = (orgs[0]||{}).displayName || 'Your tenant';

  setStep('Reading license inventory…', 15);
  const subscribed = await gpage('/subscribedSkus', token);

  setStep('Reading users…', 25);
  let users, signInAvailable = true;
  const hdr = {ConsistencyLevel:'eventual'};
  try{
    users = await gpage(`/users?$select=${USER_SELECT},signInActivity&$top=999`, token, hdr,
      n => setStep(`Reading users… ${int(n)}`, Math.min(85, 25+n/40)));
  }catch(e){
    if(e.status !== 403) throw e;
    // No Entra ID Premium, or the signed-in user lacks a directory role that
    // can read audit data. Degrade rather than fail the whole audit.
    signInAvailable = false;
    setStep('Sign-in data unavailable, continuing without it…', 40);
    users = await gpage(`/users?$select=${USER_SELECT}&$top=999`, token, hdr,
      n => setStep(`Reading users… ${int(n)}`, Math.min(85, 40+n/40)));
  }

  setStep('Analysing…', 92);
  const result = analyze(subscribed, users, signInAvailable);
  result.tenant_name = tenantName;
  return result;
}

/* ══════════════════════════════════════════════════════════════════════
   Import from Microsoft 365 admin center exports

   The consent screen is the hardest step in this product. An admin who will
   not grant Organization.Read.All to an unverified publisher will happily
   click "Export users" in a portal they already trust, so this path reaches
   the same numbers with no consent, no app registration and no tokens.

   It feeds the analyzer above rather than reimplementing any of it, so an
   imported audit and a live one are the same code producing the same
   findings. Parsing happens here in the tab; nothing is uploaded, which is
   the same promise the live path makes.

   What an export cannot carry is stated rather than quietly omitted:
   service plans are absent from every CSV, so redundant-SKU detection is
   impossible on imported data. The analyzer already refuses to guess when
   plan sets are empty, so that degrades correctly on its own.
   ══════════════════════════════════════════════════════════════════════ */

/* RFC 4180 enough for real exports: quoted fields, embedded commas, doubled
   quotes, CRLF, and the BOM Excel puts on the front of everything.

   Streams a row at a time and keeps nothing. Delimiters can only be found by
   walking every character, so every field is necessarily *seen*, but only the
   allowlisted ones are ever retained. */
function eachCsvRow(text, onRow){
  const s = String(text || '').replace(/^﻿/, '');
  let row = [], field = '', q = false;
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(q){
      if(c === '"'){ if(s[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    } else if(c === '"'){ q = true; }
    else if(c === ','){ row.push(field); field = ''; }
    else if(c === '\r'){ /* handled by the \n that follows */ }
    else if(c === '\n'){ row.push(field); onRow(row); row = []; field = ''; }
    else field += c;
  }
  if(field.length || row.length){ row.push(field); onRow(row); }
}

/* Read a CSV keeping ONLY the columns named in `spec`.
   A users export routinely carries forty-odd columns, proxy addresses, object
   ids, phone numbers, postal addresses, licence GUIDs. None of that is needed
   to price a licence, so none of it is retained: the row array is transient and
   only allowlisted values are copied out of it.

   Object ids in particular are read by nothing. Findings are keyed on UPN and
   SKU part number, so an id would be a durable directory identifier ingested
   for no purpose. */
function readProjected(text, spec){
  let headers = null, idx = null, ignored = [];
  const rows = [];
  eachCsvRow(text, raw => {
    if(headers === null){
      headers = raw.map(h => String(h).trim());
      idx = {};
      const claimed = new Set();
      for(const [field, want] of Object.entries(spec)){
        /* `{all: /re/}` claims every header that matches, not just the first.
           The active-users report spreads activity across one column per
           service, Exchange, OneDrive, Teams, with no combined column, so a
           single-column field would find nothing and drop dormancy. */
        if(want && want.all){
          const hits = headers.filter(h => h && want.all.test(h));
          idx[field] = hits.map(h => headers.indexOf(h));
          hits.forEach(h => claimed.add(h));
        } else {
          const h = findCol(headers, want);
          idx[field] = h === null ? -1 : headers.indexOf(h);
          if(h !== null) claimed.add(h);
        }
      }
      ignored = headers.filter(h => h && !claimed.has(h));
      return;
    }
    if(!raw.some(v => String(v).trim() !== '')) return;
    const o = {};
    for(const field in idx){
      const i = idx[field];
      o[field] = Array.isArray(i) ? i.map(j => String(raw[j] ?? '').trim())
               : i < 0 ? '' : String(raw[i] ?? '').trim();
    }
    rows.push(o);   // raw is dropped here; nothing outside the allowlist survives
  });
  headers = headers || [];
  const present = {};
  for(const [k, v] of Object.entries(idx || {})) present[k] = Array.isArray(v) ? v.length > 0 : v >= 0;
  return { rows, headers, ignored, present };
}

/* Header names differ by admin centre, by locale and by which export button
   was pressed, so match on a squashed form rather than an exact string. */
const normHead = h => String(h || '').toLowerCase().replace(/[^a-z0-9]/g, '');
function findCol(headers, aliases){
  const norm = headers.map(h => [normHead(h), h]);
  for(const a of aliases.map(normHead)){
    const hit = norm.find(([n]) => n === a);
    if(hit) return hit[1];
  }
  // Fall back to a prefix match, which catches "Last sign-in date (UTC)".
  for(const a of aliases.map(normHead)){
    const hit = norm.find(([n]) => n.startsWith(a));
    if(hit) return hit[1];
  }
  return null;
}

/* Exports name licences the way a human reads them. Reverse the catalogue so
   "Microsoft 365 E3" resolves to SPE_E3; accept the part number too, because
   some exports carry that instead. */
const PART_BY_LABEL = (() => {
  const m = {};
  for(const [part, [name]] of Object.entries(SKU_CATALOG)){
    m[normHead(name)] = part;
    m[normHead(part)] = part;
  }
  return m;
})();

/* Products Microsoft renamed, where the new name is not a variation of the old
   one and no amount of normalising gets there. All of these came back from a
   real tenant export.

   "Planner and Project Plan 3" is the current name for Project Plan 3, a
   priced SKU, so missing it understated a real figure rather than dropping
   something free. */
const SKU_ALIASES = Object.fromEntries(Object.entries({
  'Planner and Project Plan 1': 'PROJECTESSENTIALS',
  'Planner and Project Plan 3': 'PROJECTPROFESSIONAL',
  'Planner and Project Plan 5': 'PROJECTPREMIUM',
  'Microsoft Defender for Office 365 (Plan 1)': 'ATP_ENTERPRISE',
  'Microsoft Defender for Office 365 (Plan 2)': 'THREAT_INTELLIGENCE',
  'Microsoft Fabric (Free)': 'POWER_BI_STANDARD',
}).map(([k, v]) => [normHead(k), v]));

/* An export writes names differently from the licensing reference: it prefixes
   "Microsoft ", and marks trials and superseded SKUs in the name itself. Rather
   than enumerate every combination, try the label as written and then strip
   those decorations. A stripped form is only accepted if it actually resolves,
   so this widens what is recognised without inventing matches. */
function resolveSku(label){
  const raw = String(label || '').trim();
  if(!raw) return null;
  const noMs = raw.replace(/^microsoft\s+/i, '');
  const tries = [raw, noMs,
    raw.replace(/\s*[-]\s*legacy$/i, ''),
    noMs.replace(/\s*[-]\s*legacy$/i, ''),
    raw.replace(/\s+trial$/i, ''),
    noMs.replace(/\s+trial$/i, ''),
  ];
  for(const t of tries){
    const n = normHead(t);
    if(SKU_ALIASES[n]) return SKU_ALIASES[n];
    if(PART_BY_LABEL[n]) return PART_BY_LABEL[n];
  }
  return null;
}

/* Values that mean "no licence" rather than a product nobody recognises. */
const NOT_A_LICENCE = /^(unlicensed|none|n\/?a|-|no licenses?|no licences?)$/i;

/* One cell can hold several licences, joined with "+", ";" or a newline.
   Splitting on "+" alone is wrong: some product names contain it. A real
   tenant returned "Enterprise Mobility + Security E5", which a naive split
   tore into "Enterprise Mobility" and "Security E5", neither of which
   resolves, so a paid licence vanished from the totals as "unrecognised".

   So: split only on the unambiguous separators, then walk the "+"-separated
   parts greedily, take the longest run of parts that resolves to a product,
   consume it, and continue. "Microsoft 365 E3 + Enterprise Mobility + Security
   E5" yields both, and a name containing "+" survives whether it is alone in
   the cell or not. */
function splitLicences(cell){
  const v = String(cell || '').trim();
  if(!v || NOT_A_LICENCE.test(v)) return [];
  const out = [];
  for(const chunk of v.split(/[;\n]/).map(x => x.trim()).filter(Boolean)){
    if(NOT_A_LICENCE.test(chunk)) continue;
    if(resolveSku(chunk)){ out.push(chunk); continue; }
    const parts = chunk.split('+').map(x => x.trim()).filter(Boolean);
    let i = 0;
    while(i < parts.length){
      let taken = 0;
      // Longest run first, so a "+" inside a name beats a "+" between names.
      for(let n = parts.length - i; n >= 1; n--){
        const joined = parts.slice(i, i + n).join(' + ');
        if(resolveSku(joined)){ out.push(joined); taken = n; break; }
      }
      if(!taken){ out.push(parts[i]); taken = 1; }   // unknown; reported as such
      i += taken;
    }
  }
  return out;
}

const truthy = v => /^(yes|true|1|blocked|disabled)$/i.test(String(v || '').trim());
function parseWhen(v){
  const s = String(v || '').trim();
  if(!s || /^(never|n\/?a|-|none)$/i.test(s)) return null;
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

const USER_COLS = {
  upn:   ['user principal name', 'userprincipalname', 'upn', 'username', 'user name'],
  name:  ['display name', 'displayname', 'name'],
  block: ['sign-in blocked', 'sign in blocked', 'signinblocked', 'block credential',
          'blockcredential', 'sign-in status', 'signinstatus', 'account enabled',
          'accountenabled', 'blocked'],
  lic:   ['licenses', 'licences', 'licenses assigned', 'assigned licenses',
          'assignedlicenses', 'license', 'licence', 'products',
          // Microsoft 365 active users report
          'assigned products'],
  last:  ['last sign-in', 'last sign in', 'lastsignindatetime', 'last sign-in date',
          'last signin', 'last interactive sign-in',
          'lastnoninteractivesignindatetime'],
  /* The active-users report has no combined activity column, one per service
     instead. Collect them all; the latest wins, because a person active in
     Teams and nowhere else is not dormant. */
  act:   { all: /last\s*activity\s*date/i },
  made:  ['created', 'creation date', 'createddatetime', 'when created', 'created on'],
  /* Licence assign date is the better grace-window anchor for licence waste
     than account creation: what matters is how long they have held the thing
     being paid for, not how long the account has existed. */
  given: { all: /license\s*assign\s*date/i },
  dead:  ['is deleted', 'isdeleted', 'deleted'],
  dept:  ['department'],
};

function readUsersCsv(text){
  const { rows, headers, ignored, present } = readProjected(text, USER_COLS);
  const missing = [];
  if(!present.upn) missing.push('User principal name');
  if(!present.lic) missing.push('Licenses');
  if(missing.length) throw new Error('The users export is missing: ' + missing.join(', ') +
    '. Columns found: ' + (headers.join(', ') || 'none') + '.');

  /* Which header supplied `block`, so the polarity can be read off its name. */
  const blockHeader = present.block ? findCol(headers, USER_COLS.block) : null;
  const saysEnabled = blockHeader && /enabled/i.test(blockHeader) && !/blocked/i.test(blockHeader);

  const unknown = new Set(); let withLic = 0;
  const users = rows.map(r => {
    const parts = splitLicences(r.lic).map(l => {
      const p = resolveSku(l);
      if(!p) unknown.add(l);
      return p;
    }).filter(Boolean);
    if(parts.length) withLic++;
    /* accountEnabled is inverted from the exported column: the portal reports
       whether sign-in is BLOCKED. A column named for "enabled" reads the other
       way round. With no such column at all, assume enabled, that under-counts
       disabled accounts rather than inventing them. */
    const enabled = !present.block ? true
      : saysEnabled ? !/^(no|false|0)$/i.test(r.block)
      : !truthy(r.block);
    /* Latest wins across every activity column plus any single sign-in column:
       active anywhere is active. Taking the earliest, or the first non-empty,
       would report someone who lives in Teams as dormant because their mailbox
       is quiet. */
    const dates = [parseWhen(r.last), ...(r.act || []).map(parseWhen)].filter(Boolean);
    const when = dates.length ? new Date(Math.max(...dates.map(d => d.getTime()))) : null;
    /* Earliest licence assignment: the grace window should start when they were
       first given something billable. */
    const given = (r.given || []).map(parseWhen).filter(Boolean);
    const anchor = present.made ? parseWhen(r.made)
      : given.length ? new Date(Math.min(...given.map(d => d.getTime())))
      : null;
    return {
      userPrincipalName: r.upn,
      displayName: r.name || r.upn,
      // A deleted account holding a licence is certain waste, so it is carried
      // as its own state rather than folded into "disabled".
      accountEnabled: enabled,
      isDeleted: present.dead ? truthy(r.dead) : false,
      department: r.dept || '',
      createdDateTime: anchor ? anchor.toISOString() : null,
      // Only present when the export carried a date. Absent means "no data",
      // which the analyzer treats as never-signed-in, not as active.
      signInActivity: when ? { lastSignInDateTime: when.toISOString() } : {},
      assignedLicenses: [...new Set(parts)].map(p => ({ skuId: p })),
    };
  }).filter(u => u.userPrincipalName);

  return { users, hasSignIn: present.last || present.act,
           hasCreated: present.made || present.given,
           hasBlocked: present.block, hasDeleted: present.dead,
           hasDept: present.dept, unknown: [...unknown], withLic,
           headers, ignored };
}

const LIC_COLS = {
  name: ['license', 'licence', 'product name', 'product', 'subscription name',
         'licenses', 'display name', 'subscription'],
  buy:  ['purchased', 'total', 'total licenses', 'quantity', 'paid licenses',
         'purchased quantity', 'prepaid'],
  used: ['assigned', 'assigned licenses', 'consumed', 'in use', 'used', 'assigned quantity'],
  free: ['available', 'unassigned', 'unused', 'remaining'],
};

function readLicencesCsv(text){
  const { rows, headers, ignored, present } = readProjected(text, LIC_COLS);
  if(!present.name) throw new Error('The licences export has no product-name column. ' +
    'Columns found: ' + (headers.join(', ') || 'none') + '.');
  if(!present.buy && !(present.used && present.free)) throw new Error(
    'The licences export needs a purchased count, or both assigned and available ' +
    'so it can be derived. Columns found: ' + headers.join(', ') + '.');

  const num = v => { const n = Number(String(v ?? '').replace(/[^0-9.-]/g, '')); return isFinite(n) ? n : 0; };
  const unknown = new Set(); const out = [];
  for(const r of rows){
    const part = resolveSku(r.name);
    if(!part){ if(r.name) unknown.add(r.name); continue; }
    const used = present.used ? num(r.used) : 0;
    const buy = present.buy ? num(r.buy) : used + num(r.free);
    out.push({ skuId: part, skuPartNumber: part,
               prepaidUnits: { enabled: buy }, consumedUnits: used,
               // No export carries service plans, so redundant-SKU detection
               // cannot run. The analyzer skips empty plan sets rather than
               // guessing, so this degrades correctly.
               servicePlans: [] });
  }
  return { subscribed: out, unknown: [...unknown], headers, ignored };
}

/* When no licences export is supplied, reconstruct what is assigned from the
   users file. Purchased is then unknowable, so it is set equal to assigned:
   spare seats compute to zero and no unassigned-seat findings are invented. */
function subscribedFromUsers(users){
  const count = {};
  for(const u of users) for(const a of u.assignedLicenses) count[a.skuId] = (count[a.skuId] || 0) + 1;
  return Object.entries(count).map(([part, n]) => ({
    skuId: part, skuPartNumber: part,
    prepaidUnits: { enabled: n }, consumedUnits: n, servicePlans: [],
  }));
}

function runImport(usersText, licText, tenantLabel){
  const u = readUsersCsv(usersText);
  let subs = null, licUnknown = [], licIgnored = [];
  if(licText && licText.trim()){
    const l = readLicencesCsv(licText);
    subs = l.subscribed; licUnknown = l.unknown; licIgnored = l.ignored;
  }
  const derived = !subs;
  if(derived) subs = subscribedFromUsers(u.users);
  if(!subs.length) throw new Error(
    'No recognisable licences were found. Check that the Licenses column holds ' +
    'product names such as "Microsoft 365 E3".');

  const r = analyze(subs, u.users, u.hasSignIn, DORMANT_DAYS_DEFAULT);
  r.tenant_name = tenantLabel || 'Imported export';
  r.imported = true;

  /* Say what this data cannot show. Every one of these is a finding type the
     live path produces and this one cannot, which is exactly the sort of
     silent gap that makes a total look like the whole answer. */
  /* What was and was not read goes to the console, not the report. It is a
     diagnostic for whoever is running the import, useful when a column fails
     to resolve, and it tells the reader of a licence report nothing they
     wanted to know. The allowlist is in readProjected either way. */
  const kept = u.headers.length - u.ignored.length;
  console.info(
    `WantNot import: read ${kept} of ${u.headers.length} columns from the users ` +
    `export; ${u.ignored.length} not loaded. Object ids are not read at all.`,
    { read: u.headers.filter(h => !u.ignored.includes(h)), ignored: u.ignored,
      licencesIgnored: licIgnored });

  const notes = [];

  /* A licence a user holds but the licences export never mentions cannot be
     priced, so the analyzer drops it, correctly, but silently. That is the
     shape of a total that looks complete and is not, so it is named. */
  if(!derived){
    const known = new Set(subs.map(s => s.skuId));
    const orphans = new Set();
    for(const usr of u.users) for(const a of usr.assignedLicenses)
      if(!known.has(a.skuId)) orphans.add(SKU_CATALOG[a.skuId] ? SKU_CATALOG[a.skuId][0] : a.skuId);
    if(orphans.size) notes.push(
      'Held by users but absent from the licences export, so they could not be ' +
      'priced and are excluded: ' + [...orphans].slice(0, 12).join(', ') +
      (orphans.size > 12 ? ', …' : '') + '. Re-export the licences page to include them.');
  }

  if(derived) notes.push(
    'No licences export was supplied, so purchased quantities are unknown and ' +
    'unassigned seats could not be counted. Assigned counts were derived from ' +
    'the users file. Add the licences export for the largest single category.');
  /* The active-users report has no sign-in-blocked column, so an import from it
     alone cannot find disabled accounts. That is a whole finding type going
     missing, which is exactly what must never happen quietly. */
  if(!u.hasBlocked) notes.push(
    'This export carries no sign-in-blocked column, so disabled accounts still ' +
    'holding licences could not be detected. The Active users export from the ' +
    'Microsoft 365 admin centre has that column; the usage report does not.');
  if(!u.hasSignIn) notes.push(
    'The users export carried no last-sign-in column, so dormant and ' +
    'never-signed-in accounts could not be detected. The real figure is almost ' +
    'certainly higher. Entra admin centre › Users › Export includes it.');
  if(u.hasSignIn && !u.hasCreated) notes.push(
    'No creation-date column, so accounts that have never signed in were not ' +
    'separated from newly created ones and were left out rather than guessed at.');
  notes.push(
    'Service plans are not present in any admin centre export, so redundant ' +
    'licences, a cheaper SKU wholly contained in one the user already holds, ' +
    'cannot be detected from a file. The live audit finds these.');
  if(u.unknown.length) notes.push(
    'Unrecognised licence names, excluded from the totals: ' +
    u.unknown.slice(0, 12).join(', ') + (u.unknown.length > 12 ? ', …' : '') + '.');
  if(licUnknown.length) notes.push(
    'Unrecognised products in the licences export, excluded: ' +
    licUnknown.slice(0, 12).join(', ') + (licUnknown.length > 12 ? ', …' : '') + '.');

  r.warnings = [...notes, ...(r.warnings || [])];
  return r;
}

const readFile = f => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result || ''));
  fr.onerror = () => rej(new Error('Could not read ' + f.name + '.'));
  fr.readAsText(f);
});

async function startImport(){
  const usersFile = document.getElementById('impUsers').files[0];
  const licFile = document.getElementById('impLic').files[0];
  const err = document.getElementById('impErr');
  err.textContent = '';
  if(!usersFile){ err.textContent = 'Choose the users export first.'; return; }
  const btn = document.getElementById('impGo');
  btn.disabled = true; btn.textContent = 'Reading…';
  try{
    const [ut, lt] = await Promise.all([readFile(usersFile), licFile ? readFile(licFile) : Promise.resolve('')]);
    const label = (usersFile.name || '').replace(/\.[a-z]+$/i, '') || 'Imported export';
    const r = runImport(ut, lt, label);
    lastResult = r;
    renderReport(r);
  }catch(e){
    err.textContent = e.message || 'That file could not be read as a CSV export.';
    btn.disabled = false; btn.textContent = 'Analyse these files';
  }
}

/* ══════════════════════════════════════════════════════════════════════
   Carve bar highlighting, shared by the portfolio and tenant views.

   Driven from either the band or its legend chip. The legend is not a
   convenience: the smallest band is routinely under 1% of the bar, a few
   pixels, which is not a hover target anyone can hit.

   Hover and pin are tracked separately. Inferring hover from the last call
   breaks on touch, where no mouseleave ever arrives, leaving a tapped band
   highlighted with nothing able to clear it.
   ══════════════════════════════════════════════════════════════════════ */
function wireCarve(scope) {
  const bar = scope.querySelector('.spendbar');
  const axis = scope.querySelector('.axis');
  if (!bar || !axis) return;
  const segs = [...bar.querySelectorAll('.seg')];
  const chips = [...scope.querySelectorAll('.legend-item')];
  if (!segs.length) return;

  const axisDefault = axis.innerHTML;
  const total = segs.reduce((s, el) => s + Number(el.dataset.value || 0), 0);
  let pinned = null, hovered = null;

  const paint = () => {
    const on = hovered !== null ? hovered : pinned;
    bar.classList.toggle('focused', on !== null);
    segs.forEach(el => el.classList.toggle('on', el.dataset.kind === on));
    chips.forEach(el => {
      el.classList.toggle('on', el.dataset.kind === on);
      el.setAttribute('aria-pressed', String(el.dataset.kind === pinned));
    });
    if (on === null) { axis.innerHTML = axisDefault; return; }
    const el = segs.find(s => s.dataset.kind === on);
    const v = Number(el.dataset.value || 0);
    axis.innerHTML =
      `<span class="detail"><span class="sw" style="background:${kVar(on)}"></span>` +
      `<b style="color:var(--ink)">${esc(kLabel(on))}</b>` +
      `<b style="color:${kVar(on)}">${usd0(v)}</b>` +
      `<span style="color:var(--ink-3)">a year</span>` +
      `<span class="pct">${total ? (v / total * 100).toFixed(0) : 0}% of recoverable` +
      `${pinned === on ? ' · click again to release' : ''}</span></span>`;
  };

  const wire = (el) => {
    const k = el.dataset.kind;
    el.addEventListener('mouseenter', () => { hovered = k; paint(); });
    el.addEventListener('mouseleave', () => { if (hovered === k) hovered = null; paint(); });
    el.addEventListener('focus', () => { hovered = k; paint(); });
    el.addEventListener('blur', () => { if (hovered === k) hovered = null; paint(); });
    el.addEventListener('click', e => { e.stopPropagation(); pinned = pinned === k ? null : k; paint(); });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
      if (e.key === 'Escape') { pinned = null; hovered = null; paint(); el.blur(); }
    });
  };
  segs.forEach(wire); chips.forEach(wire);
  document.addEventListener('click', () => { if (pinned !== null) { pinned = null; paint(); } });
}

function carveBar(spend, byKind){
  const waste = Object.values(byKind).reduce((a,b)=>a+b,0);
  const total = Math.max(spend, waste) || 1;
  const keepPct = Math.max(0, spend-waste)/total*100;
  const segs = ORDER.filter(k=>byKind[k]>0).map(k=>
    `<div class="seg" data-kind="${esc(k)}" data-value="${byKind[k]}" tabindex="0" role="button"
      aria-label="${esc(kLabel(k))}, ${usd0(byKind[k])} per year"
      style="width:${(byKind[k]/total*100).toFixed(3)}%;background:${kVar(k)}"></div>`).join('');
  return `<div class="spendbar">
      <div class="keep" style="width:${keepPct.toFixed(3)}%"><span>Working spend</span></div>${segs}
    </div>
    <div class="axis"><span><b>${compact(spend-waste)}</b> working</span>
      <span><b style="color:var(--hot)">${compact(waste)}</b> recoverable</span></div>`;
}

function renderReport(r){

  /* Bottom-line totals, summed from raw values rather than the rounded strings
     in the cells. The table shows the 300 largest, so the listed subset and the
     full total are reported separately, totalling only what fits on screen
     would contradict the hero figure instead of confirming it. */

    all: r.findings.reduce((s,f)=>s+(f.annual_cost||0),0),

    purchased: t.purchased+(s.purchased||0), assigned: t.assigned+(s.assigned||0),

     name an action that never happened and clear a session that does not

    ? `<span class="pill"><span class="dot"></span>Imported file</span>

    : `<span class="pill"><span class="dot"></span>${esc((account&&account.username)||'')}</span>
       <button class="btn ghost sm" id="out" style="margin-left:10px">Sign out</button>`;
  document.getElementById('out').onclick = async ()=>{
    lastResult = null;
    if(!r.imported){
      try{ await msalApp.logoutPopup({account}); }catch{}
      account = null;
    }
    renderSignIn();
  };

  view().innerHTML = `
    <div class="panel rise">
      <p class="label">${esc(r.tenant_name)} · annual recoverable</p>
      <p class="hero-figure"><span class="cur">$</span>${Math.round(r.annual_waste_usd).toLocaleString('en-US')}</p>
      <p class="hero-sub"><b>${pct.toFixed(1)}%</b> of a ${compact(r.annual_spend_usd)} annual
        license bill, across <b>${r.findings.length} line item${r.findings.length===1?'':'s'}</b>, ${usd2(r.monthly_waste_usd)} every month.</p>
      ${carveBar(r.annual_spend_usd, byKind)}
      <div class="legend">${ORDER.filter(k=>byKind[k]>0).map(k=>

          ${esc(kLabel(k))} <span class="v">${usd0(byKind[k])}</span></span>`).join('')}</div>
      <div class="stats">
        <div class="stat"><div class="k">Users</div><div class="v">${int(r.total_users)}</div></div>
        <div class="stat"><div class="k">Licensed</div><div class="v">${int(r.licensed_users)}</div></div>
        <div class="stat"><div class="k">Dormant after</div><div class="v">${r.dormant_threshold_days}d</div></div>
      </div>
      <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="csv">Download CSV</button>
        <button class="btn ghost" id="again">${r.imported ? 'Import other files' : 'Run again'}</button>
      </div>
    </div>
    ${(r.warnings||[]).map(w=>`<div class="notice"><span class="m">!</span><div>${esc(w)}</div></div>`).join('')}

    <div class="sec-head"><h2 style="font-family:var(--display);font-weight:700;font-size:17px;margin:0">Findings</h2>
      <span class="sub">${r.findings.length} line items · grouped by user, click to expand</span></div>
    <div class="tscroll"><table class="data">
      <thead><tr><th>Line item</th><th>License</th><th class="r">Seats</th>
        <th>Confidence</th><th class="r">Annual</th></tr></thead>
      <tbody id="fBody">${(()=>{const rows=r.findings.slice(0,300);const m=new Map();rows.forEach(f=>{const raw=(f.user_principal_name||'').trim();const key= raw ? raw.toLowerCase() : '\u0001unassigned';let g=m.get(key);if(!g){g={key,upn:raw,name:f.user_display_name||raw||kLabel(f.kind),items:[],seats:0,usd:0};m.set(key,g);}if(!g.name&&f.user_display_name) g.name=f.user_display_name;g.items.push(f);g.seats+=f.seats||0;g.usd+=f.annual_cost||0;});const groups=[...m.values()].sort((a,b)=>b.usd-a.usd);groups.forEach(g=>{const c={};g.items.forEach(f=>c[f.kind]=(c[f.kind]||0)+1);g.domKind=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';});return groups.map((g,gi)=>{const n=g.items.length;const head=`<tr class="grp-head" data-group="${gi}" tabindex="0" role="button" aria-expanded="false"><td><div class="nm" style="display:flex;align-items:center;gap:9px"><span class="caret" style="width:10px;flex:none;color:var(--ink-3);font-size:10px">▸</span>${esc(g.name)}</div><div class="sub" style="margin-left:19px">${esc(g.upn||'no user, seats held at tenant level')}</div></td><td class="soft"><div>${n} licence${n===1?'':'s'} flagged</div><div class="sub">click to expand</div></td><td class="r money">${int(g.seats)}</td><td>${g.domKind?`<span class="badge review">${esc(kLabel(g.domKind))}</span>`:''}</td><td class="r money hot"><b>${usd0(g.usd)}</b></td></tr>`;const items=g.items.map(f=>`<tr class="grp-item" data-group="${gi}" hidden><td><div class="nm" style="display:flex;align-items:center;gap:9px;padding-left:26px"><span style="width:7px;height:7px;border-radius:2px;flex:none;background:${kVar(f.kind)}"></span>${esc(kLabel(f.kind))}</div><div class="sub" style="margin-left:26px">${esc(f.detail)}</div></td><td><div>${esc(f.sku_display_name)}</div><div class="sub">${esc(f.sku_part_number)}</div></td><td class="r money">${int(f.seats)}</td><td><span class="badge ${esc(f.confidence)}">${esc(CONF[f.confidence]||f.confidence)}</span></td><td class="r money hot">${usd0(f.annual_cost)}</td></tr>`).join('');return head+items;}).join('');})()}</tbody>
      <tfoot>
        ${r.findings.length>300?`
        <tr class="sub"><td colspan="2">Listed above, the 300 largest</td>
          <td class="r money">${int(fTot.listedSeats)}</td><td></td>
          <td class="r money">${usd0(fTot.listed)}</td></tr>
        <tr class="sub"><td colspan="2">Remaining ${r.findings.length-300}, in the CSV only</td>
          <td class="r money">${int(fTot.seats-fTot.listedSeats)}</td><td></td>

        <tr>
          <td colspan="2" class="lbl">Total recoverable

          <td class="r money">${int(fTot.seats)}</td><td></td>
          <td class="r money hot big">${usd0(fTot.all)}</td></tr>
      </tfoot>
    </table></div>

    <div class="sec-head"><h2 style="font-family:var(--display);font-weight:700;font-size:17px;margin:0">License inventory</h2></div>
    <div class="tscroll"><table class="data">
      <thead><tr><th>SKU</th><th class="r">Purchased</th><th class="r">Assigned</th>
        <th class="r">Spare</th><th class="r">Unit</th><th class="r">Monthly</th></tr></thead>
      <tbody>${r.sku_summary.map(s=>`<tr>
        <td><div class="nm">${esc(s.displayName)}</div><div class="sub">${esc(s.skuPartNumber)}</div></td>
        <td class="r money">${int(s.purchased)}</td><td class="r money">${int(s.assigned)}</td>
        <td class="r money ${s.spare>0?'hot':''}">${int(s.spare)}</td>
        <td class="r money">${s.unitPrice?usd2(s.unitPrice):'<span class="sub">, </span>'}</td>
        <td class="r money">${usd0(s.monthlySpend)}</td></tr>`).join('')}</tbody>
      <tfoot>
        <tr>
          <td class="lbl">Total committed
            <span class="recon">${r.sku_summary.length} SKU${r.sku_summary.length===1?'':'s'} ·
              ${usd0(sTot.monthlySpend*12)} annually.</span></td>
          <td class="r money">${int(sTot.purchased)}</td>
          <td class="r money">${int(sTot.assigned)}</td>
          <td class="r money ${sTot.spare>0?'hot':''}">${int(sTot.spare)}</td>
          <td></td>
          <td class="r money big">${usd0(sTot.monthlySpend)}</td></tr>
        <tr class="sub"><td colspan="6">
          Monthly. Annually that is <b>${usd0(sTot.monthlySpend*12)}</b>, of which
          <b class="hot">${usd0(r.annual_waste_usd)}</b> is recoverable,
          ${sTot.monthlySpend ? (r.annual_waste_usd/(sTot.monthlySpend*12)*100).toFixed(1) : '0.0'}% of the bill.
        </td></tr>
      </tfoot>
    </table></div>

    <div class="notice" style="margin-top:26px"><span class="m">i</span><div>
      This is a point-in-time snapshot and nothing has been saved. Close the tab and it is gone.
      Tracking recovery over time needs scheduled scans, which is what the full product does.
    </div></div>`;

  wireCarve(view());
  // grouped findings toggle — same as dashboard/dashboard.html (does not repeat user name in dropdown)
  view().querySelectorAll('#fBody tr.grp-head').forEach(h=>{
    const toggle=()=>{
      const gi=h.dataset.group;
      const open=h.getAttribute('aria-expanded')==='true';
      const next=!open;
      h.setAttribute('aria-expanded', String(next));
      const caret=h.querySelector('.caret');
      if(caret) caret.textContent= next ? '▾' : '▸';
      view().querySelectorAll(`#fBody tr.grp-item[data-group="${gi}"]`).forEach(it=>it.hidden=!next);
    };
    h.addEventListener('click', toggle);
    h.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') {e.preventDefault(); toggle();}});
  });

  // back to the file pickers rather than into a sign-in it never came from.
  document.getElementById('again').onclick = ()=> r.imported ? renderSignIn() : start();
}

function exportCsv(r){
  const q = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  const rows = [['Category','Detail','User','UPN','Department','License','SkuPartNumber','Seats',
                 'Confidence','MonthlyUSD','AnnualUSD'].join(',')];
  r.findings.forEach(f => rows.push([kLabel(f.kind), f.detail, f.user_display_name||'',
    f.user_principal_name||'', f.department||'', f.sku_display_name, f.sku_part_number, f.seats,
    CONF[f.confidence]||f.confidence, f.monthly_cost, f.annual_cost].map(q).join(',')));
  const name = (r.tenant_name||'tenant').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  const url = URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  const a = Object.assign(document.createElement('a'),
    {href:url, download:`wantnot-audit-${name}-${r.scanned_at.slice(0,10)}.csv`});
  a.style.display='none'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); try{URL.revokeObjectURL(url);}catch{} }, 1500);
}

async function start(){
  renderProgress();
  try{
    const r = await runAudit(setStep);
    renderReport(r);
  }catch(e){
    const msg = e.status === 403
      ? 'Microsoft refused the request. The signed-in account needs a role that can read '+
        'directory and audit data, Global Reader or Global Administrator.'
      : e.status === 401 ? 'The sign-in expired. Please sign in again.'
      : (e.message || 'The audit could not be completed.');
    renderSignIn(msg);
  }
}

(async function boot(){
  try{
    await initMsal();
    if(account) start(); else renderSignIn();
  }catch(e){
    if(e.message === 'NO_CONFIG' || window.__noConfig) return renderSetup();
    renderSignIn(e.message);
  }
})();
